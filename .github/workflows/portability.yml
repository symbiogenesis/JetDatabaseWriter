name: Portability

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  JDW_VALIDATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prerequisite:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.path == '.github/workflows/ci.yml' &&
            (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))) }}
    name: Require successful CI
    outputs:
      run: ${{ steps.select.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.JDW_VALIDATION_SHA }}
      - name: Verify the exact main revision passed CI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/assert-ci-success.ps1 -Sha $env:JDW_VALIDATION_SHA
      - name: Download completed CI selection
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-selection
          path: artifacts/prerequisite
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select specialized validation
        id: select
        shell: pwsh
        run: ./scripts/select-specialized-validation.ps1

  test:
    needs: prerequisite
    if: needs.prerequisite.outputs.run == 'true'
    name: Test (${{ matrix.os }}, ${{ matrix.tf }})
    runs-on: ${{ matrix.os }}
    # The complete suite includes the exhaustive statement fault sweeps.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Exact-main CI already covers the full Windows suite and analyzers.
        os: [ubuntu-latest, macos-latest]
        tf: [net10.0, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.JDW_VALIDATION_SHA }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore tests/JetDatabaseWriter.Tests --locked-mode
      - name: Build
        run: dotnet build tests/JetDatabaseWriter.Tests -c Release --no-restore -f net10.0 -p:RunAnalyzers=false
      - name: Test
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
          JDW_GOLDEN_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/golden/portability-${{ matrix.os }}-${{ matrix.tf }}
        run: >-
          dotnet test --test-modules JetDatabaseWriter.Tests.dll
          --root-directory tests/JetDatabaseWriter.Tests/bin/Release/net10.0
          --minimum-expected-tests 48
          --long-running 60 --xunit-diagnostics on --no-ansi --output Detailed --timeout 80m
          --report-xunit-xml --report-xunit-xml-filename tests.xml
          --results-directory artifacts/test-results/portability-${{ matrix.os }}-${{ matrix.tf }}
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-results-${{ matrix.os }}-${{ matrix.tf }}
          path: artifacts/test-results/portability-${{ matrix.os }}-${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload golden diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-golden-${{ matrix.os }}-${{ matrix.tf }}
          path: artifacts/golden/portability-${{ matrix.os }}-${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7

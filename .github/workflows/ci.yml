name: CI

on:
  # Pushes to other branches run CI through their pull request (or workflow_dispatch),
  # so a pull request from a branch in this repository runs once, not twice.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # publish.yml calls this workflow so a tag is packed only after the tests pass, and
  # then publishes the package this run uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# The full suite runs on Windows: it uses Windows paths and byte-range locks, and the
# DAO round-trip tests skip themselves when Access is not installed. The jobs run in
# parallel. The analyzers take most of a Release build, so four jobs share them, and the
# test legs execute their own analyzed Release binaries immediately in the same job.
jobs:
  analyze:
    name: Analyze${{ matrix.runner && ' and test' || '' }} (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both target frameworks of the library, then the package.
          - name: library
            project: JetDatabaseWriter
            pack: true
          # Every other project but the tests; the library builds without analyzers here.
          - name: tools
            project: JetDatabaseWriter.slnx
            options: '"-p:AnalyzeExcept=JetDatabaseWriter JetDatabaseWriter.Tests"'
          # The test project once per target framework; the projects it references build
          # without analyzers here.
          - name: tests net10.0
            project: JetDatabaseWriter.Tests
            options: -f net10.0 -p:AnalyzeOnly=JetDatabaseWriter.Tests
            tf: net10.0
            runner: true
          - name: tests net8.0
            project: JetDatabaseWriter.Tests
            options: -f net8.0 -p:AnalyzeOnly=JetDatabaseWriter.Tests
            tf: net8.0
            runner: true

    steps:
      # MinVer computes the package version from the tags, so fetch the full history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PowerShell scripts
        if: matrix.pack
        shell: pwsh
        run: ./scripts/test-scripts.ps1

      # Keep each security-survey CVE linked to a canonical test or explicit N/A reason.
      - name: Check security traceability
        if: matrix.pack
        shell: pwsh
        run: ./scripts/check-security-traceability.ps1

      # global.json pins the .NET 10 SDK that builds everything.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.tf == 'net8.0' && '8.0.x' || '' }}
          cache: true
          cache-dependency-path: '*/packages.lock.json'

      - name: Restore
        run: dotnet restore ${{ matrix.project }} --locked-mode

      # Release turns on every analyzer, code-style rule and XML-doc check as an error,
      # including in the test project.
      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release --no-restore ${{ matrix.options }}

      # Tests and Access hosts execute these exact analyzed binaries.
      - name: Upload DAO test runner
        if: matrix.runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dao-test-runner-${{ matrix.tf }}
          path: JetDatabaseWriter.Tests/bin/Release/${{ matrix.tf }}/
          if-no-files-found: error
          retention-days: 3

      # Each framework starts its full suite as soon as its own analyzer build passes,
      # without waiting for other lanes or rebuilding on a second runner.
      - name: Test
        if: matrix.runner
        run: >-
          dotnet test --test-modules JetDatabaseWriter.Tests.dll
          --root-directory JetDatabaseWriter.Tests/bin/Release/${{ matrix.tf }}
          --minimum-expected-tests 1
          --report-xunit-xml --report-xunit-xml-filename tests.xml
          --results-directory artifacts/test-results/${{ matrix.tf }}

      - name: Upload test results
        if: ${{ !cancelled() && matrix.runner }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.tf }}
          path: artifacts/test-results/${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Pack
        if: matrix.pack
        run: dotnet pack JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-build -o artifacts/nupkg

      # publish.yml pushes this artifact only when every job of the run has passed, so a
      # release publishes the package this run built from the tested commit instead of
      # rebuilding it.
      - name: Upload package
        if: matrix.pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  aot:
    name: Trimmed and NativeAOT consumers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Publish and run generated consumers
        shell: pwsh
        run: ./scripts/test-aot.ps1

  encryption-replacement:
    name: Encryption replacement (${{ matrix.os }}, ${{ matrix.tf }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tf: [net10.0, net8.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.tf == 'net8.0' && '8.0.x' || '' }}
          cache: true
          cache-dependency-path: '*/packages.lock.json'
      - name: Restore
        run: dotnet restore JetDatabaseWriter.Tests --locked-mode
      - name: Build
        run: dotnet build JetDatabaseWriter.Tests -c Release --no-restore -f ${{ matrix.tf }} -p:RunAnalyzers=false
      - name: Test managed file recovery and encryption replacement
        run: >-
          dotnet test --project JetDatabaseWriter.Tests -c Release --no-build -f ${{ matrix.tf }}
          --filter-class JetDatabaseWriter.Tests.Encryption.AtomicReplacementTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCancellationTests
          JetDatabaseWriter.Tests.Encryption.ReplacementDurabilityTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCrashRecoveryTests
          JetDatabaseWriter.Tests.Pages.Paging.PersistentRollbackJournalTests
          JetDatabaseWriter.Tests.Writer.CreateDatabaseTests
          JetDatabaseWriter.Tests.Writer.ShrinkCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.TransactionCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.CreationCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.RecoveryLockFileTests
          JetDatabaseWriter.Tests.Architecture.ManagedImplementationTests

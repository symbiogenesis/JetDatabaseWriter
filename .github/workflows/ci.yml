name: CI

on:
  # Pushes to other branches run CI through their pull request (or workflow_dispatch),
  # so a pull request from a branch in this repository runs once, not twice.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # publish.yml calls this workflow so a tag is packed only after the tests pass, and
  # then publishes the package this run uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# The full suite runs on Windows: it uses Windows paths and byte-range locks, and the
# DAO round-trip tests skip themselves when Access is not installed. The jobs run in
# parallel. The analyzers take most of a Release build, so five jobs share them, and the
# test legs execute their own analyzed Release binaries immediately in the same job.
jobs:
  analyze:
    name: Analyze${{ matrix.runner && ' and test' || '' }} (${{ matrix.name }})
    runs-on: windows-latest
    # Exhaustive statement fault sweeps need longer than analyzer-only lanes.
    timeout-minutes: ${{ matrix.runner && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both target frameworks of the library, then the package.
          - name: library
            project: JetDatabaseWriter
            pack: true
          # Every other project but the tests; the library builds without analyzers here.
          - name: tools
            project: JetDatabaseWriter.slnx
            options: '"-p:AnalyzeExcept=JetDatabaseWriter JetDatabaseWriter.Tests"'
          # The test project once per target framework; the projects it references build
          # without analyzers here.
          - name: tests net10.0
            project: JetDatabaseWriter.Tests
            options: -f net10.0 -p:AnalyzeOnly=JetDatabaseWriter.Tests
            tf: net10.0
            runner: true
          - name: tests net10.0 netstandard
            project: JetDatabaseWriter.Tests
            options: -f net10.0 -p:AnalyzeOnly=JetDatabaseWriter.Tests -p:TestNetStandard=true
            restore-options: -p:TestNetStandard=true
            tf: net10.0-netstandard
            runner: true
          - name: tests net11.0
            project: JetDatabaseWriter.Tests
            options: -f net10.0 -p:AnalyzeOnly=JetDatabaseWriter.Tests
            tf: net11.0
            runner: true

    steps:
      # MinVer computes the package version from the tags, so fetch the full history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PowerShell scripts
        if: matrix.pack
        shell: pwsh
        run: ./scripts/test-scripts.ps1

      # Keep each security-survey CVE linked to a canonical test or explicit N/A reason.
      - name: Check security traceability
        if: matrix.pack
        shell: pwsh
        run: ./scripts/check-security-traceability.ps1

      # global.json pins the .NET 10 SDK; .NET 11 is installed only to run compatibility tests.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '*/packages.lock.json'

      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore ${{ matrix.project }} --locked-mode ${{ matrix.restore-options }}

      # Release turns on every analyzer, code-style rule and XML-doc check as an error,
      # including in the test project.
      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release --no-restore ${{ matrix.options }}

      # Tests and Access hosts execute these exact analyzed binaries.
      - name: Upload DAO test runner
        if: matrix.runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dao-test-runner-${{ matrix.tf }}
          path: JetDatabaseWriter.Tests/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 3

      # Each framework starts its full suite as soon as its own analyzer build passes,
      # without waiting for other lanes or rebuilding on a second runner.
      - name: Test
        if: matrix.runner
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
          JDW_GOLDEN_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/golden/${{ matrix.tf }}
        run: >-
          dotnet test --test-modules JetDatabaseWriter.Tests.dll
          --root-directory JetDatabaseWriter.Tests/bin/Release/net10.0
          --minimum-expected-tests 1
          --long-running 60 --xunit-diagnostics on --no-ansi --output Detailed --timeout 80m
          --report-xunit-xml --report-xunit-xml-filename tests.xml
          --results-directory artifacts/test-results/${{ matrix.tf }}

      - name: Upload test results
        if: ${{ !cancelled() && matrix.runner }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.tf }}
          path: artifacts/test-results/${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload golden diagnostics
        if: ${{ !cancelled() && matrix.runner }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-bytes-${{ matrix.tf }}
          path: artifacts/golden/${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Pack
        if: matrix.pack
        run: dotnet pack JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-build -o artifacts/nupkg

      # publish.yml pushes this artifact only when every job of the run has passed, so a
      # release publishes the package this run built from the tested commit instead of
      # rebuilding it.
      - name: Upload package
        if: matrix.pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  infersharp:
    name: InferSharp (${{ matrix.tf }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tf: [netstandard2.1, net10.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '*/packages.lock.json'
      - name: Restore
        run: dotnet restore JetDatabaseWriter --locked-mode
      # The package embeds its symbols. Give InferSharp portable PDBs, and analyze
      # only our library rather than third-party dependencies or test fixtures.
      # The Windows lanes retain the strict Roslyn analysis and package builds.
      - name: Build analysis input
        run: >-
          dotnet build JetDatabaseWriter -c Release --no-restore -f ${{ matrix.tf }}
          -p:RunAnalyzers=false -p:DebugType=portable -p:DebugSymbols=true
      - name: Stage analysis input
        shell: bash
        env:
          TARGET_FRAMEWORK: ${{ matrix.tf }}
        run: |
          mkdir -p artifacts/infersharp-input
          cp "JetDatabaseWriter/bin/Release/$TARGET_FRAMEWORK/JetDatabaseWriter.dll" artifacts/infersharp-input/
          cp "JetDatabaseWriter/bin/Release/$TARGET_FRAMEWORK/JetDatabaseWriter.pdb" artifacts/infersharp-input/
      # Use the v1.5 container directly so translation coverage survives alongside
      # the reports. The GitHub action exports reports but drops this diagnostic.
      - name: Run InferSharp
        shell: bash
        run: |
          mkdir -p artifacts/infersharp
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /infersharp \
            --entrypoint /bin/bash \
            mcr.microsoft.com/infersharp@sha256:030eb68fb99f86f6c6351672f444a7092dceb0fdf15ac5f24ddf9f9e198484cd \
            -c 'set -euo pipefail; ./run_infersharp.sh /workspace/artifacts/infersharp-input --output-folder /workspace/artifacts/infersharp 2>&1 | tee /workspace/artifacts/infersharp/analysis.log'
      - name: Upload InferSharp reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infersharp-${{ matrix.tf }}
          path: artifacts/infersharp/
          if-no-files-found: error
          retention-days: 7
      - name: Require no InferSharp findings
        shell: pwsh
        run: |
          Get-Content -LiteralPath artifacts/infersharp/report.txt
          ./scripts/assert-infersharp.ps1 -ReportPath artifacts/infersharp/report.sarif -TranslationLogPath artifacts/infersharp/analysis.log | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  aot:
    name: Trimmed and NativeAOT consumers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Publish and run generated consumers
        shell: pwsh
        run: ./scripts/test-aot.ps1

  encryption-replacement:
    name: Encryption replacement (${{ matrix.os }}, ${{ matrix.tf }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tf: [net10.0, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '*/packages.lock.json'
      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore JetDatabaseWriter.Tests --locked-mode
      - name: Build
        run: dotnet build JetDatabaseWriter.Tests -c Release --no-restore -f net10.0 -p:RunAnalyzers=false
      - name: Test managed recovery, encryption replacement and linked-source boundaries
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
        run: >-
          dotnet test --project JetDatabaseWriter.Tests -c Release --no-build -f net10.0
          --filter-class JetDatabaseWriter.Tests.Infrastructure.LibraryTargetTests
          JetDatabaseWriter.Tests.Encryption.AtomicReplacementTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCancellationTests
          JetDatabaseWriter.Tests.Encryption.ReplacementDurabilityTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCrashRecoveryTests
          JetDatabaseWriter.Tests.Pages.Paging.PersistentRollbackJournalTests
          JetDatabaseWriter.Tests.Writer.CreateDatabaseTests
          JetDatabaseWriter.Tests.Writer.ShrinkCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.TransactionCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.CreationCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.RecoveryLockFileTests
          JetDatabaseWriter.Tests.Architecture.ManagedImplementationTests
          JetDatabaseWriter.Tests.Relationships.LinkedSourceCapabilityTests
          JetDatabaseWriter.Tests.Relationships.LinkedSourceSecurityTests
          JetDatabaseWriter.Tests.Relationships.SystemLinkedExecutionTests

name: CI

on:
  # Pushes to other branches run CI through their pull request (or workflow_dispatch),
  # so a pull request from a branch in this repository runs once, not twice.
  # Keep path filters out of these triggers: content selection below preserves the
  # required gate and common review checks even for documentation-only changes.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # publish.yml calls this workflow so a tag is packed only after the tests pass, and
  # then publishes the package this run uploads.
  workflow_call:
    inputs:
      full:
        description: Validate every lane for a reusable workflow caller
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  # Validate the settled branch tip promptly; releases must complete independently.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# The full suite runs on Windows: it uses Windows paths and byte-range locks, and the
# ordinary analyzer partitions skip DAO cases without Access; the native lane installs
# the pinned runtime and requires its selected compatibility inventory without skips.
# The jobs run in
# parallel. Every test partition retains strict Release analysis and executes its own
# analyzed binaries immediately. Format fault sweeps run beside the remaining suite.
jobs:
  changes:
    name: Select CI lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.select.outputs.dotnet }}
      formal: ${{ steps.select.outputs.formal }}
      package: ${{ steps.select.outputs.package }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation by content since validated CI ancestors
        id: select
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JDW_CI_FORCE_FULL: ${{ inputs.full || false }}
        run: ./scripts/select-ci-lanes.ps1
      - name: Upload lane selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-selection
          path: ${{ runner.temp }}/ci-selection.json
          if-no-files-found: error
          retention-days: 30

  checks:
    name: Script, security and proof review checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell scripts
        shell: pwsh
        run: ./scripts/test-scripts.ps1
      - name: Check security traceability
        shell: pwsh
        run: ./scripts/check-security-traceability.ps1
      - name: Check proof/trust review records
        shell: pwsh
        run: ./scripts/check-proof-review.ps1 -OutputDirectory "${{ runner.temp }}/jdw-proof-review"
      - name: Upload proof review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-trust-review
          path: ${{ runner.temp }}/jdw-proof-review/
          if-no-files-found: error
          retention-days: 30

  formal:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    name: Verify recovery models (Dafny)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned verifier
        shell: pwsh
        run: ./scripts/install-dafny.ps1 -Destination "${{ runner.temp }}/jdw-dafny-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Verify proofs and trust policy
        shell: pwsh
        run: >-
          ./scripts/verify-proofs.ps1
          -DafnyPath "${{ runner.temp }}/jdw-dafny-${{ github.run_id }}-${{ github.run_attempt }}/dafny/dafny"
          -OutputDirectory "${{ runner.temp }}/jdw-proof-results"

      - name: Upload proof diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-verification
          path: ${{ runner.temp }}/jdw-proof-results/
          if-no-files-found: warn
          retention-days: 30

  analyze:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    name: Analyze${{ matrix.runner && ' and test' || '' }} (${{ matrix.name }})
    runs-on: windows-latest
    # Exhaustive statement fault sweeps need longer than analyzer-only lanes.
    timeout-minutes: ${{ matrix.runner && 90 || 30 }}
    strategy:
      fail-fast: false
      # Library/tools plus every runtime and partition, from the shared definition.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      # MinVer computes the package version from the tags, so fetch the full history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # global.json pins the .NET 10 SDK; .NET 11 is installed only to run compatibility tests.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore ${{ matrix.project }} --locked-mode ${{ matrix.restore-options }}

      # Release turns on every analyzer, code-style rule and XML-doc check as an error,
      # including in the test project.
      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release --no-restore ${{ matrix.options }}

      # Tests and Access hosts execute these exact analyzed binaries.
      - name: Upload DAO test runner
        if: matrix.runner && matrix.partition == 'ordinary'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dao-test-runner-${{ matrix.tf }}
          path: tests/JetDatabaseWriter.Tests/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 3

      # The five partitions cover every test once per runtime/library pair. Each starts
      # after its own analyzer build, without waiting for other lanes or rebuilding.
      - name: Test
        if: matrix.runner
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
          JDW_GOLDEN_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/golden/${{ matrix.tf }}-${{ matrix.partition }}
        run: >-
          dotnet test --test-modules JetDatabaseWriter.Tests.dll
          --root-directory tests/JetDatabaseWriter.Tests/bin/Release/net10.0
          --minimum-expected-tests 48 ${{ matrix.test-options }}
          --long-running 60 --xunit-diagnostics on --no-ansi --output Detailed --timeout 80m
          --report-xunit-xml --report-xunit-xml-filename tests.xml
          --results-directory artifacts/test-results/${{ matrix.tf }}-${{ matrix.partition }}

      - name: Validate test outcomes
        if: ${{ !cancelled() && matrix.runner }}
        shell: pwsh
        run: ./scripts/assert-test-results.ps1 -ResultsDirectory artifacts/test-results/${{ matrix.tf }}-${{ matrix.partition }}

      - name: Upload test results
        if: ${{ !cancelled() && matrix.runner }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.tf }}-${{ matrix.partition }}
          path: artifacts/test-results/${{ matrix.tf }}-${{ matrix.partition }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload golden diagnostics
        if: ${{ !cancelled() && matrix.runner }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-bytes-${{ matrix.tf }}-${{ matrix.partition }}
          path: artifacts/golden/${{ matrix.tf }}-${{ matrix.partition }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Pack
        if: matrix.pack
        run: dotnet pack src/JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-build -o artifacts/nupkg

      # publish.yml pushes this artifact only when every job of the run has passed, so a
      # release publishes the package this run built from the tested commit instead of
      # rebuilding it.
      - name: Upload package
        if: matrix.pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Packed prose needs current package validation without unrelated test/AOT jobs.
  # Full .NET runs already pack, so selection never schedules both package paths.
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: Package documentation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore src/JetDatabaseWriter/JetDatabaseWriter.csproj --locked-mode
      - name: Pack
        run: dotnet pack src/JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-restore -o artifacts/nupkg
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  native-access:
    name: Native Access compatibility (${{ matrix.tf }})
    needs: [changes, analyze]
    if: ${{ !cancelled() && needs.changes.outputs.dotnet == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tf: [net10.0, net10.0-netstandard, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Download analyzed DAO runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dao-test-runner-${{ matrix.tf }}
          path: artifacts/native-runner
      - name: Install pinned Microsoft Access Runtime
        shell: pwsh
        run: ./scripts/install-native-access.ps1
      - name: Test native interoperability
        shell: pwsh
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
        run: ./scripts/run-native-compatibility.ps1 -RunnerDirectory artifacts/native-runner -ResultsDirectory artifacts/native-results/${{ matrix.tf }}
      - name: Upload native results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-results-${{ matrix.tf }}
          path: artifacts/native-results/${{ matrix.tf }}/
          if-no-files-found: warn
          retention-days: 7

  aot:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    name: Trimmed and NativeAOT consumers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Publish and run generated consumers
        shell: pwsh
        run: ./scripts/test-aot.ps1

  encryption-replacement:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    name: Encryption replacement (${{ matrix.os }}, ${{ matrix.tf }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tf: [net10.0, net11.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore tests/JetDatabaseWriter.Tests --locked-mode
      - name: Build
        run: dotnet build tests/JetDatabaseWriter.Tests -c Release --no-restore -f net10.0 -p:RunAnalyzers=false
      - name: Test managed recovery, encryption replacement and linked-source boundaries
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
        run: >-
          dotnet test --project tests/JetDatabaseWriter.Tests -c Release --no-build -f net10.0
          --filter-class JetDatabaseWriter.Tests.Infrastructure.LibraryTargetTests
          JetDatabaseWriter.Tests.Infrastructure.GuardTests
          JetDatabaseWriter.Tests.Encryption.AtomicReplacementTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCancellationTests
          JetDatabaseWriter.Tests.Encryption.ReplacementDurabilityTests
          JetDatabaseWriter.Tests.Encryption.ReplacementNamespaceModelTests
          JetDatabaseWriter.Tests.Encryption.ReplacementIntentTests
          JetDatabaseWriter.Tests.Encryption.ReplacementKernelTests
          JetDatabaseWriter.Tests.Encryption.ReplacementFieldConformanceTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCleanupConformanceTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCopyConformanceTests
          JetDatabaseWriter.Tests.Encryption.ReplacementPublicationConformanceTests
          JetDatabaseWriter.Tests.Encryption.ReplacementCrashRecoveryTests
          JetDatabaseWriter.Tests.Pages.Paging.PersistentRollbackJournalTests
          JetDatabaseWriter.Tests.Pages.Paging.BufferedJournalConformanceTests
          JetDatabaseWriter.Tests.Pages.Paging.RecoveryKernelTests
          JetDatabaseWriter.Tests.Pages.Paging.JournalReplayInventoryTests
          JetDatabaseWriter.Tests.ValueEncoding.LongValueDescriptorKernelTests
          JetDatabaseWriter.Tests.Writer.CreateDatabaseTests
          JetDatabaseWriter.Tests.Writer.ShrinkCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.TransactionCrashRecoveryTests
          JetDatabaseWriter.Tests.Writer.CreationCrashRecoveryTests
          JetDatabaseWriter.Tests.Transactions.RecoverableWriterLockTests
          JetDatabaseWriter.Tests.Writer.RecoveryLockFileTests
          JetDatabaseWriter.Tests.Writer.RecoveryReplayCrashTests
          JetDatabaseWriter.Tests.Infrastructure.CrashRecoveryProcessTests
          JetDatabaseWriter.Tests.Architecture.ManagedImplementationTests
          JetDatabaseWriter.Tests.Relationships.LinkedSourceCapabilityTests
          JetDatabaseWriter.Tests.Relationships.LinkedSourceSecurityTests
          JetDatabaseWriter.Tests.Relationships.SystemLinkedExecutionTests

  gate:
    name: CI gate
    needs: [changes, checks, formal, analyze, native-access, aot, encryption-replacement, package]
    # Evaluate failed/skipped dependencies, but release superseded branch runs promptly.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected lane to pass
        shell: pwsh
        env:
          JDW_CI_NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/select-ci-lanes.ps1 -CheckResults

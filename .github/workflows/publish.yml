name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The full CI run (Release build with analyzers, both test legs) must pass first.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ github.workspace }}/JetDatabaseWriter/JetDatabaseWriter.csproj --locked-mode

      - name: Build
        run: dotnet build ${{ github.workspace }}/JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-restore

      - name: Create NuGet package
        run: dotnet pack ${{ github.workspace }}/JetDatabaseWriter/JetDatabaseWriter.csproj -c Release --no-build -o ${{ github.workspace }}/nupkg

      - name: List files (debug)
        run: dir ${{ github.workspace }}\nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}\nupkg\*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

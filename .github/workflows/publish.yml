name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Every CI lane must pass before the exact package it produced can be published.
  ci:
    uses: ./.github/workflows/ci.yml

  # Publishes the package the CI run above built and tested; nothing is rebuilt here.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify release readiness
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/assert-release-readiness.ps1 -Sha $env:GITHUB_SHA
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg

      # MinVer packs a tagged commit as the tag's version. This catches a tag it did not
      # use, such as one that is not a vX.Y.Z version (CI then packs a prerelease).
      - name: Check package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          $package = "nupkg/JetDatabaseWriter.$version.nupkg"
          if (-not (Test-Path $package)) {
            Get-ChildItem nupkg
            throw "CI did not pack $package; the package version does not match the tag $env:TAG."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # No --skip-duplicate: pushing a version nuget.org already has fails the run
      # instead of reporting a publish that did not happen.
      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json

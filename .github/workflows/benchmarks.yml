name: Benchmarks

# Runs BenchmarkDotNet on a GitHub-hosted runner, so benchmarks never load a shared
# development machine. Start it with gh workflow run benchmarks.yml --ref main, or
# from the Actions tab. With a baseline, the baseline commit and the dispatched commit
# run back to back on the same runner, and the run summary compares the two.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet --filter patterns, separated by spaces (for example *AccessWriterBenchmarks*)
        required: true
        type: string
      baseline:
        description: Commit, branch or tag to compare against on the same runner; leave empty to run only the dispatched commit
        required: false
        default: ''
        type: string
      mode:
        description: Paired comparison, or repeated swapped-order comparison plus an identical-head control on one runner
        required: false
        default: paired
        type: choice
        options:
          - paired
          - controlled
      job:
        description: BenchmarkDotNet job; default is the adaptive job for release-quality numbers
        required: false
        default: default
        type: choice
        options:
          - default
          - short
          - medium
          - dry

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmarks:
    name: Benchmarks
    # Windows, like the development machines and the test job; some benchmarks are Windows only.
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The inputs reach the scripts only through environment variables, never through
      # expression interpolation inside a script.
      - name: Check out the baseline
        if: inputs.baseline != ''
        shell: pwsh
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/baseline" "$env:BASELINE"
          if ($LASTEXITCODE -ne 0) { throw "Cannot check out the baseline '$env:BASELINE'." }
          git -C "$env:RUNNER_TEMP/baseline" log -1 --format='Baseline: %H %s'

      - name: Build
        shell: pwsh
        run: |
          dotnet restore JetDatabaseWriter.Benchmarks --locked-mode
          dotnet build JetDatabaseWriter.Benchmarks -c Release --no-restore

      - name: Build the baseline
        if: inputs.baseline != ''
        shell: pwsh
        working-directory: ${{ runner.temp }}/baseline
        run: |
          dotnet restore JetDatabaseWriter.Benchmarks --locked-mode
          dotnet build JetDatabaseWriter.Benchmarks -c Release --no-restore

      - name: Run the measurements
        shell: pwsh
        env:
          FILTER: ${{ inputs.filter }}
          JOB: ${{ inputs.job }}
          MODE: ${{ inputs.mode }}
          HAS_BASELINE: ${{ inputs.baseline != '' }}
        run: |
          $baseline = if ($env:HAS_BASELINE -eq 'true') { "$env:RUNNER_TEMP/baseline" } else { '' }
          ./scripts/run-benchmark-comparison.ps1 -Head $env:GITHUB_WORKSPACE -Baseline $baseline -Results "$env:RUNNER_TEMP/results" -Filter $env:FILTER -Job $env:JOB -Mode $env:MODE

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          $results = "$env:RUNNER_TEMP/results"
          $summary = ./scripts/run-benchmark-comparison.ps1 -Results $results -SummaryOnly
          New-Item -ItemType Directory -Force $results | Out-Null
          [IO.File]::WriteAllText("$results/summary.md", ($summary -join "`n"))
          $summary | Add-Content -Encoding utf8NoBOM $env:GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30

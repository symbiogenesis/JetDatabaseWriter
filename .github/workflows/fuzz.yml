name: Adversarial fuzz
run-name: "Validation: fuzz ${{ github.event.workflow_run.head_sha || github.sha }}"
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per harness and target framework
        default: '64'
        required: true
      seed:
        description: Reproducible mutation seed
        default: '20261015'
        required: true
permissions:
  contents: read
  actions: read

env:
  JDW_VALIDATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prerequisite:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (github.event.workflow_run.path == '.github/workflows/ci.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/ci.yml@')) &&
            (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))) }}
    name: Require successful CI
    outputs:
      run: ${{ steps.select.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.JDW_VALIDATION_SHA }}
      - name: Verify the exact main revision passed CI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/assert-ci-success.ps1 -Sha $env:JDW_VALIDATION_SHA
      - name: Download completed CI selection
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-selection
          path: artifacts/prerequisite
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select specialized validation
        id: select
        shell: pwsh
        run: ./scripts/select-specialized-validation.ps1

  fuzz:
    name: Fuzz (${{ matrix.tf }})
    needs: prerequisite
    if: needs.prerequisite.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tf: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.JDW_VALIDATION_SHA }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Setup .NET 11 runtime
        if: matrix.tf == 'net11.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .github/dotnet11/global.json
      - name: Restore
        run: dotnet restore tests/JetDatabaseWriter.Tests --locked-mode
      - name: Build
        run: dotnet build tests/JetDatabaseWriter.Tests -c Release --no-restore -f net10.0 -p:RunAnalyzers=false
      - name: Bounded process fuzz cases
        shell: pwsh
        env:
          JDW_EXPECTED_RUNTIME_MAJOR: ${{ matrix.tf == 'net11.0' && '11' || '10' }}
          DOTNET_ROLL_FORWARD: ${{ matrix.tf == 'net11.0' && 'LatestMajor' || 'LatestPatch' }}
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: ${{ matrix.tf == 'net11.0' && '1' || '0' }}
          FUZZ_CASES: ${{ inputs.cases || '64' }}
          FUZZ_SEED: ${{ inputs.seed || github.run_number }}
        run: ./scripts/run-hosted-fuzz.ps1 -Runner tests/JetDatabaseWriter.Tests/bin/Release/net10.0/JetDatabaseWriter.Tests.exe -Cases ([int]$env:FUZZ_CASES) -Seed ([int]$env:FUZZ_SEED)
      - name: Summarize mutation and operation coverage
        if: always()
        shell: pwsh
        run: |
          $path = 'artifacts/fuzz/coverage-manifest.json'
          if (Test-Path -LiteralPath $path) {
            $coverage = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $lines = @(
              '### Adversarial fuzz coverage',
              ('Revision: `{0}`' -f $coverage.Revision),
              ('Executed cases: {0}; failures: {1}; aborted: {2}' -f $coverage.ExecutedCases, $coverage.Failures, $coverage.Aborted),
              ('Mutation groups: {0}/{1}' -f $coverage.ExecutedGroups.Count, $coverage.AvailableGroups.Count),
              ('Missing groups: {0}' -f ($coverage.MissingGroups -join ', ')),
              ('Missing reader operations: {0}' -f ($coverage.MissingOperations -join ', ')),
              '', '| Operation | Cases reaching operation |', '|---|---:|'
            )
            foreach ($operation in $coverage.OperationCounts) {
              $lines += '| {0} | {1} |' -f $operation.Name, $operation.Count
            }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $lines
          }
      - name: Retain reproductions and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.tf }}
          path: artifacts/fuzz/
          if-no-files-found: error
          retention-days: 7

  release-evidence:
    name: Record release evidence
    needs: [prerequisite, fuzz]
    if: ${{ success() && needs.prerequisite.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.JDW_VALIDATION_SHA }}
      - name: Record successful campaign
        shell: pwsh
        run: ./scripts/write-release-evidence.ps1 -Kind fuzz
      - name: Retain release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-fuzz-${{ env.JDW_VALIDATION_SHA }}
          path: artifacts/release-evidence/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
